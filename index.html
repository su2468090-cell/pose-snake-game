<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹캠 뱀게임 (Teachable Machine)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: #1e1f26;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { margin: 0 0 16px; font-size: 24px; }
  .wrap { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .panel {
    background: #2a2c36;
    border-radius: 12px;
    padding: 16px;
  }
  #game { background: #111; border-radius: 8px; display: block; }
  .info { display: flex; justify-content: space-between; margin-top: 10px; font-size: 18px; }
  #webcam-container canvas { border-radius: 8px; display: block; }
  .bar-row { display: flex; align-items: center; margin: 6px 0; font-size: 14px; }
  .bar-row .label { width: 70px; }
  .bar-row .bar { flex: 1; height: 18px; background: #444; border-radius: 4px; overflow: hidden; margin: 0 8px; }
  .bar-row .fill { height: 100%; width: 0; background: #4caf50; transition: width .1s; }
  .bar-row.active .fill { background: #ffc107; }
  .bar-row .pct { width: 44px; text-align: right; }
  button {
    background: #4caf50; color: #fff; border: none; border-radius: 8px;
    padding: 10px 18px; font-size: 16px; cursor: pointer; margin: 4px 4px 0 0;
  }
  button:disabled { background: #555; cursor: default; }
  #current { font-size: 32px; text-align: center; margin: 10px 0; font-weight: bold; }
  .controls label { display: block; margin-top: 10px; font-size: 14px; }
  .controls input { width: 100%; }
  #status { font-size: 13px; color: #aaa; margin-top: 8px; min-height: 18px; }
</style>
</head>
<body>
<h1>🐍 웹캠으로 조종하는 뱀게임</h1>

<div class="wrap">
  <div class="panel">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="info">
      <span>점수: <b id="score">0</b></span>
      <span>최고: <b id="best">0</b></span>
    </div>
    <div>
      <button id="startBtn">게임 시작</button>
      <button id="pauseBtn" disabled>일시정지</button>
    </div>
  </div>

  <div class="panel" style="width: 300px;">
    <button id="camBtn">웹캠 & 모델 켜기</button>
    <div id="status">버튼을 눌러 웹캠을 켜세요. (키보드 방향키도 사용 가능)</div>
    <div id="webcam-container" style="margin-top:10px;"></div>
    <div id="current">-</div>
    <div id="bars"></div>
    <div class="controls">
      <label>인식 기준 확률: <span id="thVal">0.80</span>
        <input type="range" id="threshold" min="0.5" max="0.99" step="0.01" value="0.8">
      </label>
      <label>뱀 속도: <span id="spVal">200</span>ms
        <input type="range" id="speed" min="80" max="500" step="10" value="200">
      </label>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
// ================== Teachable Machine ==================
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/0rKF5szCM/";
const DIRS = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
const ARROWS = { up: "⬆️ UP", down: "⬇️ DOWN", left: "⬅️ LEFT", right: "➡️ RIGHT", neutral: "⏺ NEUTRAL" };

let model, webcam, maxPredictions;
let barEls = [];
let threshold = 0.8;

const statusEl = document.getElementById("status");
const currentEl = document.getElementById("current");

document.getElementById("camBtn").addEventListener("click", async (e) => {
  e.target.disabled = true;
  try {
    statusEl.textContent = "모델 불러오는 중...";
    model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
    maxPredictions = model.getTotalClasses();

    statusEl.textContent = "웹캠 켜는 중...";
    webcam = new tmImage.Webcam(260, 260, true); // flip = true (거울 모드)
    await webcam.setup();
    await webcam.play();
    document.getElementById("webcam-container").appendChild(webcam.canvas);

    const barsEl = document.getElementById("bars");
    model.getClassLabels().forEach((name) => {
      const row = document.createElement("div");
      row.className = "bar-row";
      row.innerHTML = `<span class="label">${name}</span><div class="bar"><div class="fill"></div></div><span class="pct">0%</span>`;
      barsEl.appendChild(row);
      barEls.push(row);
    });

    statusEl.textContent = "준비 완료! 게임 시작을 누르세요.";
    window.requestAnimationFrame(loop);
  } catch (err) {
    console.error(err);
    statusEl.textContent = "오류: " + err.message + " (localhost 서버로 열었는지, 카메라 권한을 확인하세요)";
    e.target.disabled = false;
  }
});

async function loop() {
  webcam.update();
  await predict();
  window.requestAnimationFrame(loop);
}

async function predict() {
  const prediction = await model.predict(webcam.canvas);
  let best = prediction[0];
  prediction.forEach((p, i) => {
    if (p.probability > best.probability) best = p;
    const row = barEls[i];
    row.querySelector(".fill").style.width = (p.probability * 100).toFixed(0) + "%";
    row.querySelector(".pct").textContent = (p.probability * 100).toFixed(0) + "%";
  });
  barEls.forEach((row, i) => row.classList.toggle("active", prediction[i] === best && best.probability >= threshold));

  const name = best.className.trim().toLowerCase();
  if (best.probability >= threshold) {
    currentEl.textContent = ARROWS[name] || best.className;
    if (DIRS[name]) setDirection(name);
    // neutral 이면 현재 방향 유지
  } else {
    currentEl.textContent = "…";
  }
}

// ================== Snake Game ==================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const CELL = 20;
const COLS = canvas.width / CELL;
const ROWS = canvas.height / CELL;

let snake, dir, nextDir, food, score, running = false, paused = false, timer = null;
let speed = 200;
let best = Number(localStorage.getItem("snakeBest") || 0);
document.getElementById("best").textContent = best;

function resetGame() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = DIRS.right;
  nextDir = dir;
  score = 0;
  document.getElementById("score").textContent = score;
  placeFood();
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (snake.some((s) => s.x === food.x && s.y === food.y));
}

function setDirection(name) {
  const d = DIRS[name];
  // 바로 반대 방향으로는 전환 불가
  if (d.x === -dir.x && d.y === -dir.y) return;
  nextDir = d;
}

function tick() {
  if (!running || paused) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
  const hitSelf = snake.some((s) => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return gameOver();

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById("score").textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
  timer = setTimeout(tick, speed);
}

function draw() {
  ctx.fillStyle = "#111";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#ff5252";
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
  ctx.fill();

  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? "#8bc34a" : "#4caf50";
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
  });
}

function drawMessage(text) {
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 28px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);
}

function gameOver() {
  running = false;
  if (score > best) {
    best = score;
    localStorage.setItem("snakeBest", best);
    document.getElementById("best").textContent = best;
  }
  drawMessage("GAME OVER - " + score + "점");
  document.getElementById("startBtn").textContent = "다시 시작";
  document.getElementById("pauseBtn").disabled = true;
}

function startGame() {
  clearTimeout(timer);
  resetGame();
  running = true;
  paused = false;
  document.getElementById("pauseBtn").disabled = false;
  document.getElementById("pauseBtn").textContent = "일시정지";
  draw();
  timer = setTimeout(tick, speed);
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  document.getElementById("pauseBtn").textContent = paused ? "계속하기" : "일시정지";
  if (paused) {
    clearTimeout(timer);
    drawMessage("일시정지");
  } else {
    draw();
    timer = setTimeout(tick, speed);
  }
}

document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("pauseBtn").addEventListener("click", togglePause);

document.getElementById("threshold").addEventListener("input", (e) => {
  threshold = Number(e.target.value);
  document.getElementById("thVal").textContent = threshold.toFixed(2);
});
document.getElementById("speed").addEventListener("input", (e) => {
  speed = Number(e.target.value);
  document.getElementById("spVal").textContent = speed;
});

// 키보드 조작 (테스트용)
document.addEventListener("keydown", (e) => {
  const map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
  if (map[e.key]) { e.preventDefault(); setDirection(map[e.key]); }
  if (e.key === " ") { e.preventDefault(); running ? togglePause() : startGame(); }
});

resetGame();
draw();
drawMessage("게임 시작을 누르세요");
</script>
</body>
</html>
